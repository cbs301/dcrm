{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm border-danger">
      <div class="card-body">
        <h4 class="card-title mb-3">Delete Grade</h4>
        <p>Are you sure you want to delete the grade for <strong>{{ grade.course }}</strong> ({{ grade.semester }}) for <strong>{{ grade.student.first_name }} {{ grade.student.last_name }}</strong>? This action cannot be undone.</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-between">
            <a href="{% url 'student_detail' grade.student.pk %}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
